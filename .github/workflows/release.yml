name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish Ubuntu 26.04 image
    needs: checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Check version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          assert os.environ['RELEASE_TAG'] == 'v' + json.load(open('package.json'))['version']
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
      - name: Verify anonymous image access
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker logout ghcr.io
          for attempt in $(seq 1 40); do
            if docker buildx imagetools inspect "$IMAGE:$VERSION" > image-manifest.txt 2>&1; then
              cat image-manifest.txt
              exit 0
            fi
            printf 'Waiting for public GHCR access (%s/40)\n' "$attempt"
            sleep 15
          done
          cat image-manifest.txt
          exit 1

  release:
    name: Publish project release
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish release with project source and container links
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Run the Linux amd64/arm64 container:

          \`\`\`sh
          docker pull ghcr.io/$REPOSITORY:$VERSION
          \`\`\`

          [Container image](https://github.com/$REPOSITORY/pkgs/container/bw2kbdx) · [Quick start](https://github.com/$REPOSITORY/blob/$RELEASE_TAG/README.md#quick-start)

          Project source is available in the automatically generated **Source code (zip)** and **Source code (tar.gz)** downloads below.
          Third-party tools and libraries are included in the container; see [their notices and upstream sources](https://github.com/$REPOSITORY/blob/$RELEASE_TAG/THIRD_PARTY_NOTICES.md).
          EOF
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
